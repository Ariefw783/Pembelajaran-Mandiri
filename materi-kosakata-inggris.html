<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kosakata Inggris - Kelas 2 SD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
        }
        .title-font {
            font-family: 'Fredoka One', cursive;
        }
        .input-box {
            transition: all 0.3s ease;
        }
        .input-box:focus {
            transform: scale(1.02);
            border-color: #3b82f6;
            outline: none;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 0px #e2e8f0;
        }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="text-center my-6">
            <h1 class="title-font text-3xl text-blue-500 mb-2">Ayo Berlatih! 🌟</h1>
            <p class="text-gray-600 font-semibold">Kosakata Bahasa Inggris - Kelas 2 SD</p>
        </div>

        <!-- Soal Section -->
        <div class="card p-6 mb-8">
            <form id="quizForm" class="space-y-4">
                
                <!-- Row Soal -->
                <div class="flex items-center space-x-3 bg-blue-50 p-3 rounded-xl">
                    <span class="font-bold text-blue-600 w-8">1.</span>
                    <label class="flex-1 font-semibold text-gray-700">Foot =</label>
                    <input type="text" data-answer="kaki" class="input-box w-32 p-2 border-2 border-blue-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-green-50 p-3 rounded-xl">
                    <span class="font-bold text-green-600 w-8">2.</span>
                    <label class="flex-1 font-semibold text-gray-700">Dog =</label>
                    <input type="text" data-answer="anjing" class="input-box w-32 p-2 border-2 border-green-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-yellow-50 p-3 rounded-xl">
                    <span class="font-bold text-yellow-600 w-8">3.</span>
                    <label class="flex-1 font-semibold text-gray-700">Hair =</label>
                    <input type="text" data-answer="rambut" class="input-box w-32 p-2 border-2 border-yellow-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-purple-50 p-3 rounded-xl">
                    <span class="font-bold text-purple-600 w-8">4.</span>
                    <label class="flex-1 font-semibold text-gray-700">Kucing =</label>
                    <input type="text" data-answer="cat" class="input-box w-32 p-2 border-2 border-purple-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-pink-50 p-3 rounded-xl">
                    <span class="font-bold text-pink-600 w-8">5.</span>
                    <label class="flex-1 font-semibold text-gray-700">Wajah =</label>
                    <input type="text" data-answer="face" class="input-box w-32 p-2 border-2 border-pink-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-orange-50 p-3 rounded-xl">
                    <span class="font-bold text-orange-600 w-8">6.</span>
                    <label class="flex-1 font-semibold text-gray-700">Sapi =</label>
                    <input type="text" data-answer="cow" class="input-box w-32 p-2 border-2 border-orange-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-indigo-50 p-3 rounded-xl">
                    <span class="font-bold text-indigo-600 w-8">7.</span>
                    <label class="flex-1 font-semibold text-gray-700">Kaki =</label>
                    <input type="text" data-answer="foot" class="input-box w-32 p-2 border-2 border-indigo-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-red-50 p-3 rounded-xl">
                    <span class="font-bold text-red-600 w-8">8.</span>
                    <label class="flex-1 font-semibold text-gray-700">Rambut =</label>
                    <input type="text" data-answer="hair" class="input-box w-32 p-2 border-2 border-red-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-teal-50 p-3 rounded-xl">
                    <span class="font-bold text-teal-600 w-8">9.</span>
                    <label class="flex-1 font-semibold text-gray-700">Face =</label>
                    <input type="text" data-answer="wajah" class="input-box w-32 p-2 border-2 border-teal-200 rounded-lg text-center" placeholder="...">
                </div>

                <div class="flex items-center space-x-3 bg-cyan-50 p-3 rounded-xl">
                    <span class="font-bold text-cyan-600 w-8">10.</span>
                    <label class="flex-1 font-semibold text-gray-700">Cat =</label>
                    <input type="text" data-answer="kucing" class="input-box w-32 p-2 border-2 border-cyan-200 rounded-lg text-center" placeholder="...">
                </div>

            </form>
        </div>

        <!-- Kalkulator Nilai Section -->
        <div class="card p-6 bg-blue-600 text-white shadow-xl">
            <h2 class="title-font text-xl mb-4 text-center">🧮 Hitung Nilai Kamu</h2>
            <div class="flex flex-col items-center space-y-4">
                <button onclick="calculateScore()" class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-bold py-3 px-8 rounded-full shadow-lg transition-transform active:scale-95">
                    Cek Hasil Nilai!
                </button>
                
                <div id="resultArea" class="hidden text-center animate-bounce">
                    <p class="text-lg font-semibold mt-2">Nilai Kamu:</p>
                    <p id="scoreDisplay" class="text-5xl font-bold">0</p>
                    <p id="feedbackText" class="text-sm mt-2 italic font-medium"></p>
                </div>
            </div>
        </div>

        <p class="text-center text-gray-400 text-sm mt-6">Dibuat untuk belajar seru di rumah ✨</p>
    </div>

    <script>
        function calculateScore() {
            const inputs = document.querySelectorAll('#quizForm input');
            let correctCount = 0;
            const totalQuestions = inputs.length;

            inputs.forEach(input => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = input.getAttribute('data-answer').toLowerCase();
                
                if (userAnswer === correctAnswer) {
                    correctCount++;
                }
            });

            // Hitung nilai (skala 0-100)
            const score = (correctCount / totalQuestions) * 100;

            // Tampilkan hasil
            const resultArea = document.getElementById('resultArea');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const feedbackText = document.getElementById('feedbackText');

            resultArea.classList.remove('hidden');
            scoreDisplay.innerText = score;

            if (score === 100) {
                feedbackText.innerText = "Luar Biasa! Sempurna! 🎉";
            } else if (score >= 70) {
                feedbackText.innerText = "Bagus sekali! Terus belajar ya! 👍";
            } else if (score > 0) {
                feedbackText.innerText = "Ayo coba lagi, kamu pasti bisa! 💪";
            } else {
                feedbackText.innerText = "Semangat! Coba isi jawabannya dulu ya! 😊";
            }

            // Scroll ke hasil
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
