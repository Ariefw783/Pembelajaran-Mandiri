<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kosakata Inggris - 15 Soal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff7ed;
        }
        .title-font {
            font-family: 'Fredoka One', cursive;
        }
        .input-box {
            transition: all 0.2s ease;
        }
        .input-box:focus {
            transform: scale(1.05);
            border-color: #f97316;
            outline: none;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.2);
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 0px #fed7aa;
        }
        .question-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="p-4 pb-24">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="text-center my-8">
            <h1 class="title-font text-4xl text-orange-500 mb-2 drop-shadow-sm">Super Quiz! 🏆</h1>
            <p class="text-gray-600 font-bold uppercase tracking-wider text-sm">Hafalan Kosakata Kelas 2 SD</p>
        </div>

        <!-- Soal Section -->
        <div class="card p-6 mb-8 border-2 border-orange-100">
            <form id="quizForm" class="space-y-1">
                
                <!-- 15 Soal -->
                <div class="question-row bg-orange-50">
                    <span class="font-bold text-orange-600 w-6 text-center">1</span>
                    <label class="flex-1 font-semibold text-gray-700">Foot :</label>
                    <input type="text" data-answer="kaki" class="input-box w-36 p-2 border-2 border-orange-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-blue-50">
                    <span class="font-bold text-blue-600 w-6 text-center">2</span>
                    <label class="flex-1 font-semibold text-gray-700">Duck :</label>
                    <input type="text" data-answer="bebek" class="input-box w-36 p-2 border-2 border-blue-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-green-50">
                    <span class="font-bold text-green-600 w-6 text-center">3</span>
                    <label class="flex-1 font-semibold text-gray-700">Cat :</label>
                    <input type="text" data-answer="kucing" class="input-box w-36 p-2 border-2 border-green-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-purple-50">
                    <span class="font-bold text-purple-600 w-6 text-center">4</span>
                    <label class="flex-1 font-semibold text-gray-700">Sapi :</label>
                    <input type="text" data-answer="cow" class="input-box w-36 p-2 border-2 border-purple-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-pink-50">
                    <span class="font-bold text-pink-600 w-6 text-center">5</span>
                    <label class="flex-1 font-semibold text-gray-700">Horse :</label>
                    <input type="text" data-answer="kuda" class="input-box w-36 p-2 border-2 border-pink-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-yellow-50">
                    <span class="font-bold text-yellow-600 w-6 text-center">6</span>
                    <label class="flex-1 font-semibold text-gray-700">Goat :</label>
                    <input type="text" data-answer="kambing" class="input-box w-36 p-2 border-2 border-yellow-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-indigo-50">
                    <span class="font-bold text-indigo-600 w-6 text-center">7</span>
                    <label class="flex-1 font-semibold text-gray-700">Bird :</label>
                    <input type="text" data-answer="burung" class="input-box w-36 p-2 border-2 border-indigo-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-teal-50">
                    <span class="font-bold text-teal-600 w-6 text-center">8</span>
                    <label class="flex-1 font-semibold text-gray-700">Cow :</label>
                    <input type="text" data-answer="sapi" class="input-box w-36 p-2 border-2 border-teal-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-red-50">
                    <span class="font-bold text-red-600 w-6 text-center">9</span>
                    <label class="flex-1 font-semibold text-gray-700">Fish :</label>
                    <input type="text" data-answer="ikan" class="input-box w-36 p-2 border-2 border-red-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-cyan-50">
                    <span class="font-bold text-cyan-600 w-6 text-center">10</span>
                    <label class="flex-1 font-semibold text-gray-700">Face :</label>
                    <input type="text" data-answer="wajah" class="input-box w-36 p-2 border-2 border-cyan-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-orange-50">
                    <span class="font-bold text-orange-600 w-6 text-center">11</span>
                    <label class="flex-1 font-semibold text-gray-700">Hair :</label>
                    <input type="text" data-answer="rambut" class="input-box w-36 p-2 border-2 border-orange-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-blue-50">
                    <span class="font-bold text-blue-600 w-6 text-center">12</span>
                    <label class="flex-1 font-semibold text-gray-700">Kuda :</label>
                    <input type="text" data-answer="horse" class="input-box w-36 p-2 border-2 border-blue-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-green-50">
                    <span class="font-bold text-green-600 w-6 text-center">13</span>
                    <label class="flex-1 font-semibold text-gray-700">Kaki :</label>
                    <input type="text" data-answer="foot" class="input-box w-36 p-2 border-2 border-green-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-purple-50">
                    <span class="font-bold text-purple-600 w-6 text-center">14</span>
                    <label class="flex-1 font-semibold text-gray-700">Burung :</label>
                    <input type="text" data-answer="bird" class="input-box w-36 p-2 border-2 border-purple-200 rounded-xl text-center" placeholder="...">
                </div>

                <div class="question-row bg-pink-50">
                    <span class="font-bold text-pink-600 w-6 text-center">15</span>
                    <label class="flex-1 font-semibold text-gray-700">Dog :</label>
                    <input type="text" data-answer="anjing" class="input-box w-36 p-2 border-2 border-pink-200 rounded-xl text-center" placeholder="...">
                </div>

            </form>
        </div>

        <!-- Kalkulator Section -->
        <div class="card p-8 bg-gradient-to-br from-orange-400 to-orange-500 text-white shadow-2xl relative overflow-hidden">
            <div class="relative z-10 flex flex-col items-center">
                <h2 class="title-font text-2xl mb-4">Cek Nilaimu Yuk! 🎒</h2>
                <button onclick="calculateScore()" class="bg-white text-orange-600 font-black py-4 px-10 rounded-2xl shadow-lg hover:bg-orange-50 transition-all active:scale-95 text-xl">
                    HITUNG SKOR
                </button>
                
                <div id="resultArea" class="hidden mt-6 text-center">
                    <div class="bg-white/20 p-4 rounded-3xl backdrop-blur-sm">
                        <p class="text-sm font-bold uppercase tracking-widest opacity-90">Skor Akhir</p>
                        <p id="scoreDisplay" class="text-7xl font-black">0</p>
                    </div>
                    <p id="feedbackText" class="text-xl mt-4 font-bold drop-shadow-md"></p>
                </div>
            </div>
            <!-- Hiasan background -->
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-white/10 rounded-full"></div>
            <div class="absolute -top-10 -left-10 w-24 h-24 bg-black/5 rounded-full"></div>
        </div>

    </div>

    <script>
        function calculateScore() {
            const inputs = document.querySelectorAll('#quizForm input');
            let correctCount = 0;
            const totalQuestions = inputs.length;

            inputs.forEach(input => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = input.getAttribute('data-answer').toLowerCase();
                
                if (userAnswer === correctAnswer) {
                    correctCount++;
                }
            });

            // Hitung nilai (skala 0-100) dibulatkan
            const rawScore = (correctCount / totalQuestions) * 100;
            const score = Math.round(rawScore);

            const resultArea = document.getElementById('resultArea');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const feedbackText = document.getElementById('feedbackText');

            resultArea.classList.remove('hidden');
            scoreDisplay.innerText = score;

            if (score === 100) {
                feedbackText.innerText = "Wow! Kamu Hebat Sekali! 🌈🌟";
            } else if (score >= 80) {
                feedbackText.innerText = "Keren! Dikit lagi sempurna! 🚀";
            } else if (score >= 60) {
                feedbackText.innerText = "Bagus! Terus berlatih ya! 📚";
            } else if (score > 0) {
                feedbackText.innerText = "Jangan menyerah, coba lagi! 💪";
            } else {
                feedbackText.innerText = "Ayo isi jawabannya dulu, ya! 😊";
            }

            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
